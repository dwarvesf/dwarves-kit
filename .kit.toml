# dwarves-kit project overrides (ADR-0034 config layer; project beats kit-root).

# The kit's own enforcement code counts as a hard path, so an edit to it needs the full lane's
# gates at push. Adds to the built-in hard paths; nothing here can remove one.
[lanes]
extra_hard_paths = "^hooks/|^lib/gate/|^lib/classify/|^lib/config/|^kit[.]toml$"

# lib/session/ is session transcript tooling (observe, recall, search), not authentication. The auth
# hard path reads the directory name "session" as auth. Auth only: secret, ci, infra and kit-config
# paths under it still hit, and lib/session.ts stays a canary.
[[gate.hard_path_exempt]]
paths  = ["lib/session/**"]
kinds  = ["auth"]
reason = "lib/session/ is session transcript tooling, not authentication"
