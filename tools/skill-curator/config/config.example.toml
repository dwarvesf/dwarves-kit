# cc-self-improve config. Copy to ~/.claude/cc-self-improve/config.toml (install.sh does this).
# Every value here is also overridable by the matching CC_SI_* env var (env wins), which is how
# the tests inject fixtures. None of these are secrets.

# --- reviewer (Phase A) ---
enabled        = true            # master switch for the skill-review hook
model          = "haiku"         # reviewer model (claude -p --model); cheap by default
max_turns      = 2               # claude -p --max-turns; the reviewer is a single-shot pure function
transcript_k   = 40              # last K user+assistant turns fed to the reviewer
# The reviewer ALWAYS runs --allowedTools "" (no filesystem write); not configurable (SPEC-103 DEC-008).

# --- promote gate (Phase B) ---
# Closer Hermes parity WITHOUT losing the default human gate. When true, `skill-review auto`
# auto-promotes ONLY the lowest-risk class: a draft explicitly tagged `cc-si-kind: references-add`
# that targets a `references/<topic>.md` under an umbrella that ALREADY EXISTS in skills/, and that
# passes the secret scan. NEVER a new skill, NEVER a SKILL.md-body/trigger edit. Everything else
# still stages for manual `/skill-review`. RISK: an auto-applied additive reference can still be
# wrong; you only skip the human read for the safest class. Default OFF.
auto_promote   = false

# --- paths (defaults; override via CC_SI_* env for tests) ---
# state_dir     = "~/.claude/cc-self-improve"     # ledger.jsonl + state/reviewer.lock + config.toml
# proposals_dir = "~/.claude/skill-proposals"     # staging gate (NOT ~/.claude/skills/)
# skills_dir    = "~/.claude/skills"              # curator input (Phase C)

# --- curator (Phase C; not active until installed) ---
# curator_enabled = false
# curator_model   = "haiku"
