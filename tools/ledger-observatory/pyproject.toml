[project]
name = "ledger-observatory"
version = "0.2.0"
description = "Read-only DuckDB lens + agent-callable CLI over the scattered kit/tide/tg-cleanup/learned ledgers"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5",
    "typer>=0.12",
]

[project.scripts]
ledger = "ledger_observatory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_observatory"]
