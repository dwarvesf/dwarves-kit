name        = "cc-observe"
description = "Report my own Claude Code usage from session transcripts: which Skills and tools fire (with error rates) and per-hook execution latency (p50/p95/max) plus hook errors. Pure JSONL parsing of ~/.claude/projects, no instrumentation. Built for the cc-elevation self-observability axis (2026-06)."
language    = "python"
status      = "pilot"
entry       = "bin/cc-observe"
created     = 2026-06-14

# Personal/standalone tool. `bin/cc-vps-report` bridges the weekly digest to the live
# vps-mon (HMAC-signed /v1/snapshot + cc-intel-weekly heartbeat -> public /status).
consumers   = []

systems     = ["claude-code", "vps-mon"]

# cc-vps-report reads these at runtime (op:// refs); HMAC_KEY_CC_AIR lives on the worker.
secrets     = ["op://Toolkit/cc-vps-report/credential", "op://Toolkit/cc-vps-report/hb_token"]

depends_on  = []
