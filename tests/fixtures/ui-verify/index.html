<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kit fixture app</title>
</head>
<body>
<main>
  <h1>Kit fixture app</h1>
  <label>Display name <input type="text" id="name"></label>
  <button type="button" id="save">Save</button>
  <p role="status" id="result"></p>
  <p id="layout"></p>
</main>
<script>
  var params = new URLSearchParams(location.search);
  var result = document.getElementById('result');
  document.getElementById('layout').textContent = window.innerWidth < 500 ? 'narrow layout' : 'wide layout';
  if (params.get('twin') === '1') {
    var twin = document.createElement('button');
    twin.type = 'button';
    twin.textContent = 'Save';
    document.querySelector('main').appendChild(twin);
  }
  if (params.get('link') === 'expired') {
    result.textContent = 'This link has expired';
    document.getElementById('save').disabled = true;
  }
  document.getElementById('save').addEventListener('click', function () {
    var typed = document.getElementById('name').value;
    result.textContent = params.get('bug') === '1' ? 'Error 500' : (typed ? 'Saved ' + typed : 'Saved');
  });
</script>
</body>
</html>
