<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Other port page</title>
</head>
<body>
<main>
  <h1>Other port page</h1>
  <p role="status" id="state"></p>
</main>
<script>
  var host = '127.0.0.1:__PORT2__';
  var plain = fetch('http://' + host + '/pixel', { mode: 'no-cors' }).then(function () {}, function () {});
  var json = fetch('http://' + host + '/post', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: '{"probe":1}'
  }).then(function () {}, function () {});
  var socket = new Promise(function (resolve) {
    try {
      var ws = new WebSocket('ws://' + host + '/socket');
      ws.onopen = ws.onerror = ws.onclose = function () { resolve(); };
    } catch (error) { resolve(); }
  });
  Promise.all([plain, json, socket]).then(function () {
    document.getElementById('state').textContent = 'other port done';
  });
</script>
</body>
</html>
