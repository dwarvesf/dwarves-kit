# Test fixture: an operator overlay that turns every quality gate ON. The kit root defaults
# them to false (opt-in), so a suite that exercises a gate's BLOCK path points
# KIT_CONFIG_OPERATOR here instead of depending on the developer's own overlay.
[gate]
proof_of_done      = true
lane_gates         = true
understanding_gate = true
commit_format      = true
board_row_gate     = true

# Every toggleable module ON too: hooks/anchor-root.sh skips a hook whose module is off, and a
# suite that drives an opt-in hook through the wrapper needs it to run.
[modules]
board          = true
session        = true
advisor        = true
cosmetic       = true
money_gate     = true
prose_rag      = true
