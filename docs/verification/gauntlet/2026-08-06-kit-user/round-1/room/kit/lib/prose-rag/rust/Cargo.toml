[package]
name = "prose-rag"
version = "0.1.0"
edition = "2021"
description = "Semantic retrieval over my own prose. Rust port: static embeddings (model2vec), incremental index."

[dependencies]
# model2vec static embeddings: token lookup + mean + normalize. No transformer at
# inference, so indexing the whole corpus is seconds on one core. (A candle+Metal
# BERT port was tried first and benchmarked WORSE than Python/ONNX: ~10s per batch;
# see docs/implementation-notes/rust-port.md.)
safetensors = "0.4"
half = "2"
tokenizers = "0.21"
hf-hub = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
anyhow = "1"
memmap2 = "0.9.11"

[profile.release]
lto = true
strip = true
