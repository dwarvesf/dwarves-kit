[project]
name = "stats"
version = "0.3.0"
description = "Read-only stateless projection (in-memory DuckDB lens) over the kit ledger + scattered source ledgers. Persists nothing; recomputes from the log."
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5",
    "typer>=0.12",
]

[project.scripts]
stats = "stats.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stats"]
