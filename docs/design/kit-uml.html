# dwarves-kit

The kit is six clusters of bash, Python and prose commands that meet at a few shared stores. The spine (lane commands and their agents) moves one unit of work from intake to land. Gates and ledgers record and enforce what the spine did. Execution planes run many sessions at once. The board and signal path carries work items and proposals. Session and knowledge reads transcripts and distills them. Hooks wire all of it to Claude Code events and run the audit loops.

This model is a backfill. It maps the kit as the code stands on master, from a read-only pass with `path:line` evidence, spot-checked against the code. Amber marks planned work: the workset module. Cluster colors hold on every sheet: spine blue, gates rose, planes violet, board green, hooks gray, session plain. Boxes marked «external» belong to another cluster or sit outside the kit.

## Use cases

Four actors drive the kit. The operator starts and lands work, the agent session runs the lane commands, a scheduler (launchd or cron) runs the unattended passes, and the Claude Code runtime fires hooks on its own events. The operator can also review a design as UML before the spec.

## V-model

Every artifact is checked twice: a static review when it is built (left arm, rose gates) and a dynamic test when it runs (right arm, green), paired level by level. Test design (`/kit:test-plan`) sits on the right arm in the command inventory, though it runs before the build.

```uml
id: v-model
type: component
title: The V-model, build and test
level: L1
caption: Blue is the left arm (build), green the right arm (test), rose the static quality gates (review, not test execution). Dashed green edges pair each right-arm verifier with the left-arm level it tests; rose edges show the static gate that reviews that level.
review:
  - "Lanes skip whole levels: tiny runs only build and review, bug starts at test-plan, backfill never builds. Is that the right floor, or should the bug lane also run design critique for a risky fix?"
  - "`/kit:execute` dispatches task, integration and acceptance verifiers, but system-verifier runs only from `/kit:verify`. Should execute run the system level on the full lane, so it is not on-demand only?"
lanes:
  - {id: gates, name: static quality gates, tone: rose}
nodes:
  - {id: bgate, name: brief-reviewer, note: "agent, clarity and testability", tone: rose, lane: gates, at: [0, 0]}
  - {id: dgate, name: /kit:devs-team, note: 5 lenses on the design, tone: rose, lane: gates, at: [0, 1]}

Which lanes run which levels, from the lane x phase depth matrix in `docs/WORKFLOW.md` (the human view of `[lane.*]` in `kit.toml`). Design covers the design critique too; spec covers validate.

| Lane | Brief | Design | Spec | Test plan | Build | Review | Ship |
|---|---|---|---|---|---|---|---|
| tiny | skip | skip | skip | skip | run-lite | run-lite | skip |
| normal | run-lite | skip | measure-twice | run-lite | measure-twice | measure-twice | measure-twice |
| full | measure-twice | measure-twice | measure-twice | measure-twice | measure-twice | measure-twice | measure-twice |
| bug | skip | skip | skip | run-lite | measure-twice | measure-twice | run-lite |
| backfill | run-lite | skip | run-lite | skip | skip | run-lite | skip |

The right arm has no lane columns of its own. `/kit:execute` dispatches the task, integration and acceptance verifiers inside every build, `/kit:verify` re-runs all four levels on demand, and the ship-gate enforces the lane's required phases only at push.

## Gates and ledgers

## Ledger stores

The ledger root holds append-only text, one physical line per event. Every `runs/<rid>.log` line goes through `gate-ledger.sh` and `ledger_append`; only a GATE line with `ran` or `override` satisfies `check`, and every other line type is additive. The rid is the branch slug with its `type/` prefix stripped. Writers and readers per table:

- `runs/<rid>.log`: written by gate-ledger verbs (called by the spine commands, orchestrate, wt.sh, quiz-gate, significance-classify, coverage-delta, mutation-smoke, weekend-batch, harvest sweep). Read by ship-gate, mega-merge, lane-telemetry, stats, weekend-batch, batch-debt-warn, precedent, pitch, the mega projections and reflect.
- `proof-overrides.log`: written by `proof-ledger override` (operator, wrap-adopt, agents on docs paths). Read only by `proof-ledger is-overridden`.
- `completeness.log`: written by `lane-classify check` on a downgrade. Read by `lane-telemetry misfires`.
- `queue-journal.tsv`: written by queue.sh and the watch-board reaper. Read by watch-board dedup and `queue wait`.
- `audit-runs.log`: written by `audit ran`. Read by `audit due`.
- `merge-watch/<sid>.log` and the two `.cache` files: written and read by the one tool that owns each (batch-debt-warn, gate-ledger `check`, lane-telemetry).

```uml

type: erd

## Mega-goal sub-goal

One ROADMAP sub-goal as `orchestrate.sh` sees it. The ROADMAP stores only unchecked or checked; every other state is the last event in `.orchestrate/events.log` (`orchestrate.sh:466-553`). A serial run accepts a bare local `[x]` with no `PR #n` (`orchestrate.sh:2795-2830`), and only a `gate` sub-goal is checked against `gh pr view` (`orchestrate.sh:456-463`). The watchdog only alerts on a stall and never kills (`orchestrate.sh:1101-1105`). No `.orchestrate/events.log` exists on the Mini or the Air, so this path has not run there. Pre-flight records `blocked` for a bad `Model:`, `Effort:` or `Harness:`, and for a `gate` or `gate!` sub-goal whose goal file has no `**Branch:**` (`orchestrate.sh:1335-1340`, `orchestrate.sh:2700-2705`). An `auto` sub-goal without the header keeps running (190 of 771 goal files lack it).

## Attempt store

The `/kit:dispatch` flow from `seq-dispatch`, as `attempt-state.sh` records it: a task machine (blue) and an attempt machine per worker (violet), with legal moves listed in `attempt-state.sh:63-75` and anything else refused. The two meet in the verbs: `dispatch` opens a `running` attempt, `lose-attempt` sends the task back to `queued`, and `commit-result` marks it `done`. The store has no lock and relies on the lead calling it in sequence (`attempt-state.sh:26-29`), an accepted trade-off until two callers can hit it at once.

  - "`release` deletes the task file outright. Should a `done` record stay until the branch merges, so a re-dispatch of the same slug sees the winner?"

## Cross-cutting concepts

- Layered config. One TOML reader, `lib/config/kit-config.sh`, resolves a key from the project `.kit.toml`, then the operator `~/.config/dwarves-kit/kit.toml`, then the kit-root `kit.toml`. The project layer counts only when it is tracked and clean, or when read at a revision with `--at`. Two readers sit on top: `gate-policy.sh` for `[gate]` keys (any reader error means ON) and `lane-data.sh` for `[lane.*]` phases. Vendor enablement, `runner_host`, `probe_key_ref` and `[decide]` are root-only on purpose. `[modules]` decides which hooks run: `lib/config/modules.tsv` maps each hook to its module, and `anchor-root.sh` skips a hook whose module is off (the spine never is).
- The ledger root resolver. `kit-log-dir.sh` picks `$KIT_LEDGER_DIR`, else `$DWARVES_KIT_LOG_DIR`, else `[ledger].location`, else `${XDG_STATE_HOME:-~/.local/state}/dwarves-kit/logs`. A set-but-empty `KIT_LEDGER_DIR` is fatal. Every append goes through `lib/ledger/ledger.sh`, which collapses newlines so one event is one physical line. Hook audit logs use the same root through `hook-log-dir.sh`, in a `hooks/` subdirectory.
- Fail-open versus fail-closed, per gate. safety-gate: always on, documented accepted holes. ship-gate: closed on an unloadable ship-rules, an unparsable push in an adopted repo, a missing Lane; open when no kit `lib/` exists. proof-ledger `check`: open on no base, a bad ref or a missing lib. gate-policy: an unreadable reader means ON. Advisory measures (coverage-delta, mutation-smoke, check-edit, load-warn, money-gate without STRICT): always exit 0. Codex adapter: closed, but Codex treats a hook failure as non-blocking.
- Egress points. `claude -p --model haiku` from harvest and backlog-stage (transcript tails); `claude -p` sonnet from reflect propose, session-audit and the skill-curator reviewer; `claude -p` workers from the orchestrator and the queue; Jev or Clef HTTPS from flick (candidate slugs, gated by `decide.points`, `deny_words`, `word_gate`); webcheck HTTP to consumer-declared sites (http(s) only, same-host redirects); `hermes kanban` from the mirror and the sync spoke; `gh` from mega-merge, writeback, wrap and ci-drift. Every LLM egress fails open and exits 0.
- Worktree isolation and merge at the lead. Wave sessions, dispatch workers and `wrap start` each get a worktree under `.claude/worktrees/`. Workers never merge: the orchestrator converges one PR at a time under `flip.lock`, `/kit:dispatch` hands READY branches to the lead's `/kit:ship`, and tier-4 close HOLDs for a human. The serial orchestrator path and the queue still run in the real checkout.
- Staging as the human gate. Proposers (stats anomalies, reflect propose, session-audit triage, session-intel, the stage hooks, `wrap stage`) append `[staged]` blocks through one grammar (`staging-format.py`, with a `.jq` twin for bash). `board promote` is the gate that mints a row, and every row write goes through `backlog.sh add`, under the board lock. Staging writes go through one lock, `staging_lock`.
- One rid per run. The rid is the branch slug with `type/` stripped, derived after the branch exists. The same key joins assign-time records, ship-gate's push check, mega-merge and telemetry.

## Risks and technical debt

Ranked by blast radius, widest first. Open risks come first; accepted trade-offs follow. Closed items live in git and the PRs, the latest being the pre-flight refusal of a `gate` sub-goal with no `**Branch:**` (#1010).

No open risks; accepted trade-offs below carry their reopen triggers.

**Accepted trade-offs**

- Hermes bridges: two separate jobs, because retiring either breaks a running job.
- One spec file, many writers: replace-not-stack sections and a pinned blob keep voided rounds cheap.
- Narrow verifier allowlists: the narrow list is the safer default, and recheck re-executes what it allows.
- Plugin hooks register for every module: one bash start per skipped hook is cheap.
- Stat-keyed caches: the 2-second window is short and a recheck is cheap.
- Advisory and unwired parts: advisory by design, and the `bin/` forwarders arrive with the workset fold.
- Unsandboxed workers on shared state. The queue and the serial orchestrator run `--dangerously-skip-permissions` in the real checkout, and protected-path writes are detected only after the run, with sanitize on (implied by `--from-boards`, and passed by the watcher). Mitigation: sanitize, the XPIA fence, `#queue{}` allow-listing, wave worktrees, the `flip.lock`. The queue ran 10 rows ever, all on the Air, none in the last month, and no `.orchestrate/events.log` exists on the Mini or the Air. Reopen when the queue or the serial path runs regularly again.
- Self-reported completion on the serial path. A serial sub-goal counts done on its box alone: a bare local `[x]` passes, and only the remote reconcile needs `PR #n` (`orchestrate.sh:2795-2830`). The queue already needs a git delta or a new PR for `done`, and a `gate` sub-goal needs `gh pr view` to find its PR. Reopen on the first serial orchestrator run.
- `attempt-state.sh` has no lock: one lead calls it in sequence. Reopen when two callers can hit the store at once.
- Degrade path, vendor harnesses: they run with no turn cap, watchdog or token capture, and no goal file in the estate declares `**Harness:**`. Reopen on the first one that does.
- Degrade path, an `auto` sub-goal with no `**Branch:**`: it runs without START, so telemetry shows lane `?`; 190 of 771 goal files lack the header. Reopen on the first serial orchestrator run.
- Degrade path, a failed SPEC reservation: the worker picks its own number. Stopping it was rejected, not deferred: the code documents the reservation as best-effort over a scan-safe fallback (`orchestrate.sh:1342-1348`, `orchestrate.sh:1951-1953`), so stopping would turn a rare duplicate number into a stopped wave.

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js" integrity="sha384-+pxiN6T7yvpryuJmE1gM9PX7yQit15auDb+ZwwvJOd/4be2Cie5/IuVXgQb/S9du" crossorigin="anonymous"></script>
<script>
// system-design: parse a SYSTEM-DESIGN.md model and diff two of them. Pure functions, no DOM.
// The build inlines this file into template.html; test.mjs requires it in node.

var UML_TYPES = ['usecase', 'class', 'erd', 'sequence', 'state', 'component'];

var idn = function (e) { return typeof e === 'string' ? e : (e.id || e.name); };
var arrowKey = function (extra) {
  return function (e) { return e.id || (e.from + ' → ' + e.to + (e[extra] ? ' ' + e[extra] : '')); };
};

// Per type: [field, kind label, identity fn]. Identity is id, else name, else from/to.
var UML_COLL = {
  usecase: [['actors', 'actor', idn], ['cases', 'case', idn]],
  class: [['classes', 'class', idn], ['relations', 'relation', arrowKey('kind')]],
  erd: [['tables', 'table', idn], ['rels', 'rel', arrowKey('label')]],
  sequence: [['participants', 'participant', idn], ['messages', 'message', function (e) { return e.from + '|' + e.to + '|' + e.text; }]],
  state: [['states', 'state', idn], ['transitions', 'transition', arrowKey('event')]],
  component: [['nodes', 'node', idn], ['edges', 'edge', arrowKey('label')]]
};

// Rows inside an element that get their own +/-/~ marks.
var rowName = function (r) { return Array.isArray(r) ? String(r[0]) : String(r).split(/[:(\s]/)[0]; };
var UML_ROWS = { table: [['cols', 'col']], class: [['attrs', 'attr'], ['ops', 'op']] };

// Layout hints place an element on its sheet and tone colors it; neither is a design change, so the delta skips them.
var LAYOUT_KEYS = { at: 1, via: 1, route: 1, side: 1, lane: 1, tone: 1 };
function bare(v) {
  if (!v || typeof v !== 'object' || Array.isArray(v)) return v;
  var o = {}, ks = Object.keys(v).filter(function (k) { return !LAYOUT_KEYS[k]; });
  ks.forEach(function (k) { o[k] = v[k]; });
  // A participant given as {name: X, tone: ...} is the same participant as the string X.
  return ks.length === 1 && ks[0] === 'name' && typeof o.name === 'string' ? o.name : o;
}

function canon(v) {
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(function (k) { return JSON.stringify(k) + ':' + canon(v[k]); }).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}

var PROSE_SECTIONS = /^##\s+(Cross-cutting concepts|Risks and technical debt)\s*$/i;

// Split prose on "## " headings: named sections (or every heading when all) go to model.sections,
// the rest returns as the diagram note.
function takeSections(text, model, all) {
  return text.split(/^(?=## )/m).filter(function (seg) {
    var hm = /^##\s+(.+)$/m.exec(seg);
    if (!/^## /.test(seg) || !(all || PROSE_SECTIONS.test(seg.split('\n')[0]))) return !all;
    model.sections.push({ title: hm[1].trim(), body: seg.slice(seg.indexOf('\n') + 1).trim() });
    return false;
  }).join('');
}

function parseModel(md, load) {
  var model = { title: '', intro: '', rev: '', decided: [], diagrams: [], sections: [], errors: [] };
  // Optional front matter: rev (review round letter) and decided (decisions so far), drawn on the cover.
  var fm = /^---[ \t]*\n([\s\S]*?)\n---[ \t]*\n/.exec(md);
  if (fm) {
    md = md.slice(fm[0].length);
    try {
      var top = load(fm[1]) || {};
      if (top.rev != null) model.rev = String(top.rev);
      if (top.decided != null) model.decided = (Array.isArray(top.decided) ? top.decided : [top.decided]).map(String);
    } catch (e) { model.errors.push('front matter: YAML: ' + e.message); }
  }
  var h = /^#\s+(.+)$/m.exec(md), last = 0;
  if (h) {
    model.title = h[1].trim();
    // The prose between the title and the first heading or block is the cover's intro, not a diagram note.
    var rest = md.slice(h.index + h[0].length), stop = rest.search(/^(## |```uml)/m);
    if (stop < 0) stop = rest.length;
    model.intro = rest.slice(0, stop).trim();
    last = h.index + h[0].length + stop;
  }
  var re = /^```uml[^\n]*\n([\s\S]*?)^```[ \t]*$/gm, m, n = 0, seen = {};
  while ((m = re.exec(md))) {
    n++;
    var note = takeSections(md.slice(last, m.index), model, false);
    last = re.lastIndex;
    var spec;
    try { spec = load(m[1]); } catch (e) { model.errors.push('block ' + n + ': YAML: ' + e.message); continue; }
    if (!spec || typeof spec !== 'object') { model.errors.push('block ' + n + ': not a YAML mapping'); continue; }
    if (!spec.id) { model.errors.push('block ' + n + ': missing id'); continue; }
    if (UML_TYPES.indexOf(spec.type) < 0) { model.errors.push(spec.id + ': unknown type ' + spec.type); continue; }
    if (seen[spec.id]) { model.errors.push(spec.id + ': duplicate id'); continue; }
    seen[spec.id] = 1;
    model.diagrams.push({ id: spec.id, type: spec.type, title: spec.title || spec.id, level: spec.level || '', note: note, review: [].concat(spec.review || []).map(String), caption: spec.caption ? String(spec.caption) : "", spec: spec });
  }
  takeSections(md.slice(last), model, true);
  return model;
}

// Merge two lists by identity. Current order wins; a removed item sits after
// its nearest surviving predecessor from the base list.
function mergeList(baseArr, curArr, keyFn, norm) {
  norm = norm || bare;
  baseArr = baseArr || []; curArr = curArr || [];
  var bk = baseArr.map(keyFn), ck = curArr.map(keyFn), bmap = {}, cset = {};
  bk.forEach(function (k, i) { bmap[k] = baseArr[i]; });
  ck.forEach(function (k) { cset[k] = 1; });
  var out = curArr.map(function (el, i) {
    var k = ck[i], b = bmap[k];
    return { key: k, el: el, base: b, st: b === undefined ? 'new' : (canon(norm(b)) === canon(norm(el)) ? '' : 'changed') };
  });
  bk.forEach(function (k, i) {
    if (cset[k]) return;
    var at = 0;
    for (var j = i - 1; j >= 0; j--) {
      var p = out.findIndex(function (o) { return o.key === bk[j]; });
      if (p >= 0) { at = p + 1; break; }
    }
    out.splice(at, 0, { key: k, el: baseArr[i], base: baseArr[i], st: 'removed' });
  });
  return out;
}

function rowDetail(kind, item) {
  var specs = UML_ROWS[kind];
  if (!specs || item.st !== 'changed') return [];
  var d = [];
  specs.forEach(function (s) {
    var rows = mergeList(item.base[s[0]], item.el[s[0]], rowName);
    rows.filter(function (r) { return r.st === 'removed'; }).forEach(function (r) { d.push('-' + s[1] + ' ' + r.key); });
    rows.filter(function (r) { return r.st === 'new'; }).forEach(function (r) { d.push('+' + s[1] + ' ' + r.key); });
    rows.filter(function (r) { return r.st === 'changed'; }).forEach(function (r) { d.push('~' + s[1] + ' ' + r.key); });
  });
  Object.keys(Object.assign({}, item.base, item.el)).forEach(function (f) {
    if (LAYOUT_KEYS[f] || specs.some(function (s) { return s[0] === f; })) return;
    if (canon(item.base[f]) !== canon(item.el[f])) d.push('~' + f);
  });
  return d;
}

function fieldDetail(item) {
  if (item.st !== 'changed') return [];
  return Object.keys(Object.assign({}, item.base, item.el)).filter(function (f) {
    return !LAYOUT_KEYS[f] && canon(item.base[f]) !== canon(item.el[f]);
  }).map(function (f) { return '~' + f; });
}

// One diagram's collections merged against its base version (null = all new).
function mergeDiagram(baseD, curD, noBase) {
  var spec = (curD || baseD).spec, merged = {};
  UML_COLL[spec.type].forEach(function (c) {
    var b = baseD ? baseD.spec[c[0]] : [], cur = curD ? curD.spec[c[0]] : [];
    if (noBase) b = cur;
    var keyFn = function (e, i) { return c[2](e, i); };
    var items = c[0] === 'messages' ? mergeMessages(b, cur, keyFn) : mergeList(b, cur, keyFn);
    if (!curD) items.forEach(function (it) { it.st = 'removed'; });
    items.forEach(function (it) {
      it.kind = c[1];
      it.detail = UML_ROWS[c[1]] ? rowDetail(c[1], it) : fieldDetail(it);
      var rs = UML_ROWS[c[1]];
      if (rs) {
        it.rows = {};
        rs.forEach(function (s) {
          it.rows[s[0]] = it.st === 'changed' ? mergeList(it.base[s[0]], it.el[s[0]], rowName)
            : (it.el[s[0]] || []).map(function (r) { return { key: rowName(r), el: r, st: '' }; });
        });
      }
    });
    merged[c[0]] = items;
  });
  return merged;
}

// A message is keyed by from|to|text plus an occurrence counter, so an insert
// does not re-key the messages after it. A repeat of the same triple gets #2, #3.
function mergeMessages(b, cur, keyFn) {
  var keyed = function (arr) {
    var seen = {};
    return (arr || []).map(function (e) {
      var k = keyFn(e), n = seen[k] = (seen[k] || 0) + 1;
      return { k: n > 1 ? k + ' #' + n : k, e: e };
    });
  };
  var out = mergeList(keyed(b), keyed(cur), function (x) { return x.k; }, function (x) { return { k: x.k, e: bare(x.e) }; });
  out.forEach(function (o) { o.el = o.el.e; o.base = o.base && o.base.e; });
  return out;
}

function diffModels(base, cur) {
  var list = [], sheets = [], bmap = {}, cset = {};
  (base ? base.diagrams : []).forEach(function (d) { bmap[d.id] = d; });
  cur.diagrams.forEach(function (d) { cset[d.id] = 1; });
  cur.diagrams.forEach(function (d) {
    var b = bmap[d.id];
    if (base && !b) {
      sheets.push({ d: d, st: 'new', merged: mergeDiagram(null, d) });
      list.push({ diagram: d.id, title: d.title, st: 'new', kind: 'diagram', key: d.type, detail: [] });
      return;
    }
    var merged = mergeDiagram(b, d, !base), st = '';
    if (b && (b.type !== d.type || b.title !== d.title || b.level !== d.level)) {
      st = 'changed';
      list.push({ diagram: d.id, title: d.title, st: 'changed', kind: 'diagram', key: d.type, detail: ['~title/level/type'] });
    }
    UML_COLL[d.type].forEach(function (c) {
      merged[c[0]].forEach(function (it) {
        if (!it.st) return;
        st = 'changed';
        list.push({ diagram: d.id, title: d.title, st: it.st, kind: it.kind, key: it.key, name: it.el && typeof it.el === 'object' ? it.el.name : undefined, detail: it.detail });
      });
    });
    sheets.push({ d: d, st: st, merged: merged });
  });
  (base ? base.diagrams : []).forEach(function (b) {
    if (cset[b.id]) return;
    sheets.push({ d: b, st: 'removed', merged: mergeDiagram(b, null) });
    list.push({ diagram: b.id, title: b.title, st: 'removed', kind: 'diagram', key: b.type, detail: [] });
  });
  return { list: list, sheets: sheets };
}

function deltaLines(delta) {
  return delta.list.map(function (x) {
    return x.st + ' ' + x.diagram + ' ' + x.kind + ' ' + x.key + (x.detail.length ? ': ' + x.detail.join(', ') : '');
  });
}

if (typeof module !== 'undefined') module.exports = { parseModel: parseModel, diffModels: diffModels, deltaLines: deltaLines, mergeList: mergeList };

<script>
// system-design layout: grid placement, orthogonal routing, edge label placement. Pure functions, no DOM.
// The build inlines this file into template.html; test.mjs requires it in node.
// A diagram is a grid of cells. A hinted node sits at its `at: [col, row]`; the rest are placed
// deterministically (layered by edge direction, or one column per lane). Edges run orthogonally
// through the gutters between cells, so no edge crosses a box.

const isCell = a => Array.isArray(a) && a.length === 2 && a.every(n => Number.isInteger(n) && n >= 0);

// Longest-path rank along edge direction; back edges of cycles (found by DFS in input order) are ignored.
function rankNodes(ids, edges) {
  const out = {}, rank = {}, state = {}, back = {};
  ids.forEach(id => { out[id] = []; rank[id] = 0; });
  edges.forEach(e => { if (e.v in out && e.w in out && e.v !== e.w) out[e.v].push(e.w); });
  const dfs = v => {
    state[v] = 1;
    out[v].forEach(w => { if (state[w] === 1) back[v + '>' + w] = 1; else if (!state[w]) dfs(w); });
    state[v] = 2;
  };
  ids.forEach(id => { if (!state[id]) dfs(id); });
  for (let k = 0; k < ids.length; k++) {
    let moved = false;
    ids.forEach(v => out[v].forEach(w => {
      if (!back[v + '>' + w] && rank[w] < rank[v] + 1) { rank[w] = rank[v] + 1; moved = true; }
    }));
    if (!moved) break;
  }
  return rank;
}

// Cell per node id. o.dir 'LR' (ranks are columns) or 'TB' (ranks are rows); o.lanes = ordered lane ids,
// node.lane picks one: each lane is a column, rows follow rank. Hinted nodes keep their cell.
function placeGrid(nodes, edges, o) {
  o = o || {};
  const cell = {}, taken = {}, K = (c, r) => c + ',' + r, warn = o.warn || [];
  nodes.forEach(n => {
    if (n.at == null) return;
    if (!isCell(n.at)) { warn.push(n.id + ': at must be [col, row] of whole numbers >= 0, placed automatically'); return; }
    if (taken[K(n.at[0], n.at[1])]) { warn.push(n.id + ': cell ' + n.at + ' already holds ' + taken[K(n.at[0], n.at[1])] + ', placed automatically'); return; }
    cell[n.id] = n.at.slice(); taken[K(n.at[0], n.at[1])] = n.id;
  });
  const free = nodes.filter(n => !cell[n.id]);
  if (!free.length) return cell;
  const ids = nodes.map(n => n.id), rank = rankNodes(ids, edges);
  const lanes = o.lanes && o.lanes.length ? o.lanes : null;
  // primary axis: lane index or rank; secondary: order inside it.
  const prim = {};
  free.forEach(n => { prim[n.id] = lanes ? (lanes.indexOf(n.lane) < 0 ? lanes.length : lanes.indexOf(n.lane)) : rank[n.id]; });
  const layers = [];
  free.forEach(n => { (layers[prim[n.id]] = layers[prim[n.id]] || []).push(n.id); });
  const nb = {};
  ids.forEach(id => { nb[id] = { up: [], down: [] }; });
  edges.forEach(e => { if (nb[e.v] && nb[e.w] && e.v !== e.w) { nb[e.w].up.push(e.v); nb[e.v].down.push(e.w); } });
  const slot = {};
  if (lanes) {
    // Inside a lane, follow rank, then input order.
    layers.forEach(L => { if (!L) return; L.sort((a, b) => rank[a] - rank[b] || ids.indexOf(a) - ids.indexOf(b)).forEach((id, i) => { slot[id] = i; }); });
  } else {
    // Barycenter sweeps (stable sort keeps input order on ties), then align each node with its neighbours' median.
    layers.forEach(L => L && L.forEach((id, i) => { slot[id] = i; }));
    const bary = (L, dir) => {
      const bc = id => { const xs = nb[id][dir].filter(x => x in slot).map(x => slot[x]); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : slot[id]; };
      const keyed = L.map(id => [id, bc(id)]);
      keyed.sort((a, b) => a[1] - b[1]);
      keyed.forEach((k, i) => { slot[k[0]] = i; L[i] = k[0]; });
    };
    for (let round = 0; round < 2; round++) {
      layers.forEach(L => L && bary(L, 'up'));
      for (let i = layers.length - 1; i >= 0; i--) if (layers[i]) bary(layers[i], 'down');
    }
    layers.forEach(L => {
      if (!L) return;
      let last = -1;
      L.forEach(id => {
        const xs = nb[id].up.filter(x => x in slot && prim[x] < prim[id]).map(x => slot[x]).sort((a, b) => a - b);
        const want = xs.length ? xs[Math.floor((xs.length - 1) / 2)] : last + 1;
        slot[id] = Math.max(want, last + 1); last = slot[id];
      });
    });
  }
  const lr = lanes || (o.dir || 'LR') === 'LR';
  layers.forEach((L, p) => L && L.forEach(id => {
    let s = slot[id];
    const at = () => lr ? [p, s] : [s, p];
    while (taken[K(...at())]) s++;
    cell[id] = at(); taken[K(...at())] = id;
  }));
  return cell;
}

// Route plans in grid terms. Each plan names its shape and the gutters it uses.
// Gutter i on the column axis sits before column i (0 = left margin); on the row axis, before row i.
function planRoutes(edges, cell) {
  const occ = {};
  Object.keys(cell).forEach(id => { occ[cell[id][0] + ',' + cell[id][1]] = id; });
  const empty = (c, r) => !occ[c + ',' + r];
  const between = (a, b) => { const out = []; for (let i = Math.min(a, b) + 1; i < Math.max(a, b); i++) out.push(i); return out; };
  return edges.map(e => {
    const A = cell[e.v], B = cell[e.w];
    if (!A || !B) return null;
    if (e.v === e.w) return { t: 'self' };
    if (e.via) return { t: 'via' };
    if (e.route === 'straight') return { t: 'straight' };
    const [ca, ra] = A, [cb, rb] = B, dc = Math.sign(cb - ca), dr = Math.sign(rb - ra);
    if (ra === rb && between(ca, cb).every(c => empty(c, ra))) return { t: 'h' };
    if (ca === cb && between(ra, rb).every(r => empty(ca, r))) return { t: 'v' };
    if (ra === rb) return { t: 'uh', rg: ra };
    if (ca === cb) return { t: 'uv', cg: ca + 1 };
    // L: along A's row to B's column, then into B's top or bottom.
    if (between(ca, cb).concat([cb]).every(c => empty(c, ra)) && between(ra, rb).every(r => empty(cb, r))) return { t: 'L1' };
    // L: along A's column to B's row, then into B's side.
    if (between(ra, rb).concat([rb]).every(r => empty(ca, r)) && between(ca, cb).every(c => empty(c, rb))) return { t: 'L2' };
    // Z through a column gutter, middle gutter first.
    const cgs = []; for (let g = Math.min(ca, cb) + 1; g <= Math.max(ca, cb); g++) cgs.push(g);
    const mid = (Math.min(ca, cb) + Math.max(ca, cb) + 1) / 2;
    cgs.sort((a, b) => Math.abs(a - mid) - Math.abs(b - mid) || a - b);
    // Gutter g sits between index g-1 and g. Cells between an end and the gutter must be empty.
    const span = (a, b) => { const out = []; for (let i = a; i < b; i++) out.push(i); return out; };
    for (const g of cgs) {
      const okA = (dc > 0 ? span(ca + 1, g) : span(g, ca)).every(c => empty(c, ra));
      const okB = (dc > 0 ? span(g, cb) : span(cb + 1, g)).every(c => empty(c, rb));
      if (okA && okB) return { t: 'zh', cg: g };
    }
    const rgs = []; for (let g = Math.min(ra, rb) + 1; g <= Math.max(ra, rb); g++) rgs.push(g);
    const midr = (Math.min(ra, rb) + Math.max(ra, rb) + 1) / 2;
    rgs.sort((a, b) => Math.abs(a - midr) - Math.abs(b - midr) || a - b);
    for (const g of rgs) {
      const okA = (dr > 0 ? span(ra + 1, g) : span(g, ra)).every(r => empty(ca, r));
      const okB = (dr > 0 ? span(g, rb) : span(rb + 1, g)).every(r => empty(cb, r));
      if (okA && okB) return { t: 'zv', rg: g };
    }
    // Channel: out of A into its adjacent column gutter, along the row gutter next to B, into B.
    return { t: 'ch', cg: dc > 0 ? ca + 1 : ca, rg: dr > 0 ? rb : rb + 1 };
  });
}

// Pixel geometry from cells, node sizes and gutter widths.
function geometry(nodes, cell, gc, gr, o) {
  let nc = 0, nr = 0;
  nodes.forEach(n => { const c = cell[n.id]; if (c) { nc = Math.max(nc, c[0] + 1); nr = Math.max(nr, c[1] + 1); } });
  const cw = Array(nc).fill(o.emptyW || 60), rh = Array(nr).fill(o.emptyH || 40), seen = {};
  nodes.forEach(n => {
    const c = cell[n.id]; if (!c) return;
    cw[c[0]] = Math.max(seen['c' + c[0]] ? cw[c[0]] : 0, n.w); seen['c' + c[0]] = 1;
    rh[c[1]] = Math.max(seen['r' + c[1]] ? rh[c[1]] : 0, n.h); seen['r' + c[1]] = 1;
  });
  const cx = [], ry = [];
  let x = 0; for (let i = 0; i < nc; i++) { x += gc[i]; cx.push(x); x += cw[i]; }
  const W = x + gc[nc];
  let y = 0; for (let i = 0; i < nr; i++) { y += gr[i]; ry.push(y); y += rh[i]; }
  const H = y + gr[nr];
  const box = {};
  nodes.forEach(n => {
    const c = cell[n.id]; if (!c) return;
    box[n.id] = { x: cx[c[0]] + (cw[c[0]] - n.w) / 2, y: o.alignTop ? ry[c[1]] : ry[c[1]] + (rh[c[1]] - n.h) / 2, w: n.w, h: n.h };
  });
  const gx = i => (i === 0 ? 0 : cx[i - 1] + cw[i - 1]) + gc[i] / 2;
  const gy = i => (i === 0 ? 0 : ry[i - 1] + rh[i - 1]) + gr[i] / 2;
  const at = v => { const f = Math.floor(v); return v - f >= 0.25 ? gx(f + 1) : cx[f] + cw[f] / 2; };
  const atY = v => { const f = Math.floor(v); return v - f >= 0.25 ? gy(f + 1) : ry[f] + rh[f] / 2; };
  return { nc, nr, cw, rh, cx, ry, W, H, box, gx, gy, at, atY };
}

const sideOf = (b, s, t) => s === 'r' ? [b.x + b.w, b.y + b.h * t] : s === 'l' ? [b.x, b.y + b.h * t] : s === 'b' ? [b.x + b.w * t, b.y + b.h] : [b.x + b.w * t, b.y];
// Where the ray from a box's center toward p leaves the box.
function clip(b, p) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2, dx = p[0] - cx, dy = p[1] - cy;
  if (!dx && !dy) return [cx, cy];
  const s = Math.min(dx ? (b.w / 2) / Math.abs(dx) : Infinity, dy ? (b.h / 2) / Math.abs(dy) : Infinity);
  return [cx + dx * s, cy + dy * s];
}

// Points per edge, plus which segment sits in which gutter (for track offsets) and which ends sit on which side.
function pixelize(edges, plans, cell, G) {
  return edges.map((e, i) => {
    const p = plans[i]; if (!p) return null;
    const A = G.box[e.v], B = G.box[e.w], [ca, ra] = cell[e.v], [cb, rb] = cell[e.w];
    const acx = A.x + A.w / 2, acy = A.y + A.h / 2, bcx = B.x + B.w / 2, bcy = B.y + B.h / 2;
    const r = { pts: null, tracks: [], ends: [] };
    const hs = cb > ca ? ['r', 'l'] : ['l', 'r'], vs = rb > ra ? ['b', 't'] : ['t', 'b'];
    if (p.t === 'self') {
      const x = A.x + A.w, y = acy;
      r.pts = [[x, y - 8], [x + 22, y - 8], [x + 22, y + 8], [x, y + 8]];
    } else if (p.t === 'straight') {
      r.pts = [clip(A, [bcx, bcy]), clip(B, [acx, acy])];
    } else if (p.t === 'via') {
      const raw = [[acx, acy]].concat(e.via.map(v => [G.at(v[0]), G.atY(v[1])]), [[bcx, bcy]]);
      const pts = [raw[0]];
      for (let k = 1; k < raw.length; k++) {
        const a = pts[pts.length - 1], b = raw[k];
        if (a[0] !== b[0] && a[1] !== b[1]) pts.push([b[0], a[1]]);
        pts.push(b);
      }
      const first = pts[1], last = pts[pts.length - 2];
      pts[0] = first[1] === acy ? [first[0] > acx ? A.x + A.w : A.x, acy] : [acx, first[1] > acy ? A.y + A.h : A.y];
      pts[pts.length - 1] = last[1] === bcy ? [last[0] > bcx ? B.x + B.w : B.x, bcy] : [bcx, last[1] > bcy ? B.y + B.h : B.y];
      r.pts = pts;
    } else if (p.t === 'h') {
      const y = (Math.max(A.y, B.y) + Math.min(A.y + A.h, B.y + B.h)) / 2;
      r.pts = [[hs[0] === 'r' ? A.x + A.w : A.x, y], [hs[1] === 'l' ? B.x : B.x + B.w, y]];
      r.ends = [[e.v, hs[0], 0, 'y'], [e.w, hs[1], 1, 'y']]; r.straight = 'y';
    } else if (p.t === 'v') {
      const x = (Math.max(A.x, B.x) + Math.min(A.x + A.w, B.x + B.w)) / 2;
      r.pts = [[x, vs[0] === 'b' ? A.y + A.h : A.y], [x, vs[1] === 't' ? B.y : B.y + B.h]];
      r.ends = [[e.v, vs[0], 0, 'x'], [e.w, vs[1], 1, 'x']]; r.straight = 'x';
    } else if (p.t === 'uh') {
      const y = G.gy(p.rg);
      r.pts = [[acx, A.y], [acx, y], [bcx, y], [bcx, B.y]];
      r.tracks = [['r', p.rg, 1]]; r.ends = [[e.v, 't', 0, 'x'], [e.w, 't', 3, 'x']];
    } else if (p.t === 'uv') {
      const x = G.gx(p.cg);
      r.pts = [[A.x + A.w, acy], [x, acy], [x, bcy], [B.x + B.w, bcy]];
      r.tracks = [['c', p.cg, 1]]; r.ends = [[e.v, 'r', 0, 'y'], [e.w, 'r', 3, 'y']];
    } else if (p.t === 'L1') {
      r.pts = [[hs[0] === 'r' ? A.x + A.w : A.x, acy], [bcx, acy], [bcx, vs[1] === 't' ? B.y : B.y + B.h]];
      r.ends = [[e.v, hs[0], 0, 'y'], [e.w, vs[1], 2, 'x']];
    } else if (p.t === 'L2') {
      r.pts = [[acx, vs[0] === 'b' ? A.y + A.h : A.y], [acx, bcy], [hs[1] === 'l' ? B.x : B.x + B.w, bcy]];
      r.ends = [[e.v, vs[0], 0, 'x'], [e.w, hs[1], 2, 'y']];
    } else if (p.t === 'zh') {
      const x = G.gx(p.cg);
      r.pts = [[hs[0] === 'r' ? A.x + A.w : A.x, acy], [x, acy], [x, bcy], [hs[1] === 'l' ? B.x : B.x + B.w, bcy]];
      r.tracks = [['c', p.cg, 1]]; r.ends = [[e.v, hs[0], 0, 'y'], [e.w, hs[1], 3, 'y']];
    } else if (p.t === 'zv') {
      const y = G.gy(p.rg);
      r.pts = [[acx, vs[0] === 'b' ? A.y + A.h : A.y], [acx, y], [bcx, y], [bcx, vs[1] === 't' ? B.y : B.y + B.h]];
      r.tracks = [['r', p.rg, 1]]; r.ends = [[e.v, vs[0], 0, 'x'], [e.w, vs[1], 3, 'x']];
    } else {
      const x = G.gx(p.cg), y = G.gy(p.rg), vin = rb > ra ? 't' : 'b';
      r.pts = [[hs[0] === 'r' ? A.x + A.w : A.x, acy], [x, acy], [x, y], [bcx, y], [bcx, vin === 't' ? B.y : B.y + B.h]];
      r.tracks = [['c', p.cg, 1], ['r', p.rg, 2]]; r.ends = [[e.v, hs[0], 0, 'y'], [e.w, vin, 4, 'x']];
    }
    return r;
  });
}

// Spread segments sharing a gutter, and edge ends sharing a box side, so no two lines lie on top of each other.
function separate(routes, edges, G, step) {
  const groups = {};
  routes.forEach((r, i) => r && r.tracks.forEach(t => { (groups[t[0] + t[1]] = groups[t[0] + t[1]] || []).push([i, t]); }));
  Object.keys(groups).forEach(k => {
    const g = groups[k]; if (g.length < 2) return;
    const ax = g[0][1][0] === 'c' ? 0 : 1, oth = 1 - ax;
    g.sort((a, b) => {
      const pa = routes[a[0]].pts, pb = routes[b[0]].pts;
      return Math.min(pa[a[1][2]][oth], pa[a[1][2] + 1][oth]) - Math.min(pb[b[1][2]][oth], pb[b[1][2] + 1][oth]) || a[0] - b[0];
    });
    g.forEach(([i, t], n) => {
      const d = (n - (g.length - 1) / 2) * step, pts = routes[i].pts;
      pts[t[2]][ax] += d; pts[t[2] + 1][ax] += d;
    });
  });
  // Box sides: ends sorted by where the edge heads, then spaced evenly along the side.
  const sides = {};
  routes.forEach((r, i) => r && r.ends.forEach(en => { (sides[en[0] + '|' + en[1]] = sides[en[0] + '|' + en[1]] || []).push([i, en]); }));
  Object.keys(sides).forEach(k => {
    const s = sides[k]; if (s.length < 2) return;
    const b = G.box[s[0][1][0]], ax = s[0][1][3] === 'y' ? 1 : 0;
    const far = ([i, en]) => { const pts = routes[i].pts, j = en[2] === 0 ? Math.min(2, pts.length - 1) : Math.max(0, pts.length - 3); return pts[j][ax]; };
    s.sort((a, b2) => far(a) - far(b2) || a[0] - b2[0]);
    const len = ax ? b.h : b.w, gap = Math.min(24, len / (s.length + 1));
    s.forEach(([i, en], n) => {
      const pos = (ax ? b.y : b.x) + len / 2 + (n - (s.length - 1) / 2) * gap, pts = routes[i].pts;
      if (routes[i].straight) return; // straight lines are moved below, both ends together
      const j = en[2], nj = j === 0 ? 1 : j - 1;
      pts[j][ax] = pos; pts[nj][ax] = pos;
    });
  });
  // Parallel straight edges between the same two boxes sit side by side.
  const pairs = {};
  routes.forEach((r, i) => { if (r && r.straight) { const k = [edges[i].v, edges[i].w].sort().join('|'); (pairs[k] = pairs[k] || []).push(i); } });
  Object.keys(pairs).forEach(k => {
    const g = pairs[k]; if (g.length < 2) return;
    g.forEach((i, n) => { const ax = routes[i].straight === 'y' ? 1 : 0, d = (n - (g.length - 1) / 2) * 22; routes[i].pts.forEach(p => { p[ax] += d; }); });
  });
}

const hit = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
const segRect = (p, q) => ({ x: Math.min(p[0], q[0]) - 1, y: Math.min(p[1], q[1]) - 1, w: Math.abs(p[0] - q[0]) + 2, h: Math.abs(p[1] - q[1]) + 2 });

// Label spots: each segment, longest first, at a few points along it, on either side.
// Hard: a box, another label or the frame edge. Soft: crossing another edge's line.
function placeLabels(edges, routes, G, obstacles, LH) {
  const placed = [], fails = [], segs = [];
  routes.forEach((r, i) => r && r.pts.slice(1).forEach((q, k) => segs.push({ i, p: r.pts[k], q })));
  edges.forEach((e, i) => {
    const r = routes[i]; if (!r || !e.lw) return;
    const h = e.lines.length * LH, w = e.lw;
    const cands = [];
    r.pts.slice(1).map((q, k) => [r.pts[k], q]).sort((a, b) => Math.hypot(b[1][0] - b[0][0], b[1][1] - b[0][1]) - Math.hypot(a[1][0] - a[0][0], a[1][1] - a[0][1]))
      .forEach(([p, q]) => [0.5, 0.35, 0.65, 0.2, 0.8, 0.1, 0.9].forEach(f => {
        const mx = p[0] + (q[0] - p[0]) * f, my = p[1] + (q[1] - p[1]) * f;
        if (p[1] === q[1]) {
          cands.push({ x: mx - w / 2, y: my - h - 5, a: 'middle' }, { x: mx - w / 2, y: my + 5, a: 'middle' });
        } else if (p[0] === q[0]) {
          cands.push({ x: mx + 7, y: my - h / 2, a: 'start' }, { x: mx - 7 - w, y: my - h / 2, a: 'end' });
        } else {
          cands.push({ x: mx + 6, y: my - h - 2, a: 'start' }, { x: mx - 6 - w, y: my + 2, a: 'start' });
        }
      }));
    let best = null, bestScore = Infinity;
    cands.forEach(c => {
      const rc = { x: c.x - 2, y: c.y - 1, w: w + 4, h: h + 2 };
      let score = 0;
      if (rc.x < 2 || rc.y < 2 || rc.x + rc.w > G.W - 2 || rc.y + rc.h > G.H - 2) score += 1000;
      obstacles.forEach(b => { if (hit(rc, b)) score += 1000; });
      placed.forEach(b => { if (hit(rc, b)) score += 1000; });
      segs.forEach(s => { if (s.i !== i && hit(rc, segRect(s.p, s.q))) score += 1; });
      if (score < bestScore) { bestScore = score; best = c; }
    });
    if (!best) return;
    const rect = { x: best.x - 2, y: best.y - 1, w: w + 4, h: h + 2 };
    placed.push(rect);
    if (bestScore >= 1000) fails.push({ i, rect }); else if (bestScore > 0) fails.push({ i, rect, soft: true });
    r.label = { x: best.a === 'middle' ? best.x + w / 2 : best.a === 'end' ? best.x + w : best.x, y: best.y, a: best.a, lines: e.lines, rect };
  });
  return fails;
}

// The whole pipeline. nodes [{id, w, h, at, lane}], edges [{v, w, lines, lw, via, route}].
// o: {dir, lanes, gutterW, gutterH, margin, alignTop, warn, lineH, obstacles(G) -> rects}.
// Returns {cell, box, routes, W, H, G}. Labels that cannot find a clear spot widen the gutters around them.
function layoutGraph(nodes, edges, o) {
  o = o || {};
  const warn = o.warn || [], LH = o.lineH || 13;
  const known = {}; nodes.forEach(n => { known[n.id] = 1; });

    let x=R(b.x,b.y,b.w,b.h,'box'+(k?' '+k:''),3);
    if(c.stereotype) x+=T(cx,b.y+16,'«'+c.stereotype+'»','t-stereo','middle');
    x+=T(cx,b.y+n.nameH-11,label(c),'t-name'+(k==='rm'?' t-rm':''),'middle')+line([[b.x,b.y+n.nameH],[b.x+b.w,b.y+n.nameH]]);
    let yy=b.y+n.nameH;
    const row=(r,i,cl)=>{ const rs=ST[r.st||'']; return T(b.x+10,yy+18+i*18,rowT(r),cl+(rs?' t-'+rs:'')); };
    if(n.attrs.length){ n.attrs.forEach((r,i)=>{ x+=row(r,i,'t-col'); }); yy+=n.attrs.length*18+10; x+=line([[b.x,yy],[b.x+b.w,yy]]); }
    n.ops.forEach((r,i)=>{ x+=row(r,i,'t-ops'); });
    s+=x;
  });
  return svg(L.W,L.H,'UML class diagram: '+d.title,s);
}

/* ---------- use case ---------- */
function rUse(d,M,warn){
  const sp=d.spec, A=M.actors, C=M.cases;
  const amap={}, atone={}; A.forEach(it=>{ amap[nm(it.el)]=it; atone[nm(it.el)]=toneOf(it.el,warn,'actor '+nm(it.el)); });
  const withOnly=id=>!C.some(it=>list(it.el.actor).indexOf(id)>=0)&&C.some(it=>list(it.el.with).indexOf(id)>=0);
  const side=it=>{ const a=it.el; if(a.side==='left'||a.side==='right') return a.side; return (a.kind&&a.kind!=='human')||withOnly(nm(a))?'right':'left'; };
  const RX=Math.ceil(Math.max(100,...C.map(it=>meas(label(it.el),'case')/2+22)));
  // Fallback cells: cases of left actors fill column 0, grouped by actor in model order; every other case goes to
  // column 1, on the row of the case that includes or extends it when that row is free.
  const used={}, K=(c,r)=>c+','+r, cellOf={};
  C.forEach(it=>{ if(isCell(it.el.at)){ used[K(...it.el.at)]=1; cellOf[nm(it.el)]=it.el.at; } });
  const leftCase=it=>{ const p=list(it.el.actor)[0]; return !!(p&&amap[p]&&side(amap[p])==='left'); };
  const put=(it,col,want)=>{ let r=want; while(used[K(col,r)]) r++; cellOf[nm(it.el)]=[col,r]; used[K(col,r)]=1; };
  A.forEach(a=>C.forEach(it=>{ if(!cellOf[nm(it.el)]&&leftCase(it)&&list(it.el.actor)[0]===nm(a.el)) put(it,0,0); }));
  C.forEach(it=>{
    if(cellOf[nm(it.el)]) return;
    const id=nm(it.el), src=C.find(o=>cellOf[nm(o.el)]&&(list(o.el.include).concat(list(o.el.extend)).indexOf(id)>=0||list(it.el.extend).indexOf(nm(o.el))>=0));
    put(it,1,src?cellOf[nm(src.el)][1]:0);
  });
  const nodes=C.map(it=>({id:nm(it.el),w:RX*2,h:44,at:isCell(it.el.at)?it.el.at:cellOf[nm(it.el)],it,tone:toneOf(it.el,warn,'case '+nm(it.el))}));
  const edges=[];
  C.forEach(it=>{ const c=it.el, s=it.st==='removed'?'removed':it.st;
    list(c.include).forEach(x=>edges.push({v:nm(c),w:x,lines:['«include»'],lw:Math.ceil(meas('«include»','edge')),it:{st:s}}));
    list(c.extend).forEach(x=>edges.push({v:nm(c),w:x,lines:['«extend»'],lw:Math.ceil(meas('«extend»','edge')),it:{st:s}}));
  });
  const gutterRows={};
  list(sp.bands).forEach((band,i)=>{ if(i) gutterRows[+list(band.rows)[0]||0]=64; });
  const L=layoutGraph(nodes,edges,{dir:'LR',warn,gutterW:110,gutterH:28,margin:30,gutterRows});
  const lefts=A.filter(it=>side(it)==='left'), rights=A.filter(it=>side(it)==='right');
  const AB=Math.ceil(Math.max(124,...A.filter(it=>(it.el.kind||'human')!=='human').map(it=>meas(label(it.el),'name')+24))), hb=AB/2;
  const AW=Math.max(150,AB), ox=lefts.length?AW+40:30, oy=78, bx=ox-10, by=20, bw=L.W+20, bh=oy-by+L.H+10;
  const cb=id=>{ const b=L.box[id]; return b&&{id, cx:ox+b.x+b.w/2, cy:oy+b.y+b.h/2, rx:b.w/2}; };
  let s=`<rect class="boundary" x="${bx}" y="${by}" width="${f1(bw)}" height="${f1(bh)}" rx="14"/>`;
  if(sp.system){ const t=wrap2(sp.system,'sys',bw-40); s+=T(bx+18,by+26,t[0],'t-sys'); if(t[1]) s+=T(bx+18,by+44,t[1],'t-note'); }
  list(sp.bands).forEach((band,i)=>{
    const rows=list(band.rows), r0=+rows[0]||0;
    if(i>0) s+=line([[bx,oy+L.G.gy(r0)],[bx+bw,oy+L.G.gy(r0)]],'band');
    s+=T(bx+14,oy+L.G.gy(r0)+(i?14:6),band.name||'','t-lane');
  });
  // Actors: centered on their cases, then pushed apart so none overlap.
  const placeSide=(arr,isLeft)=>{
    const ys=arr.map(it=>{ const id=nm(it.el), cs=C.filter(c=>list(c.el.actor).concat(list(c.el.with)).indexOf(id)>=0).map(c=>cb(nm(c.el))).filter(Boolean);
      return {it,y:cs.length?cs.reduce((a,c)=>a+c.cy,0)/cs.length:oy+40,cs}; });
    ys.sort((a,b)=>a.y-b.y);
    let last=-Infinity; ys.forEach(o=>{ o.y=Math.max(o.y,last+96,oy+20); last=o.y; });
    return ys.map(o=>Object.assign(o,{x:isLeft?ox-AW/2-30:bx+bw+AW/2+10,left:isLeft}));
  };
  const placed=placeSide(lefts,true).concat(placeSide(rights,false));
  let H=by+bh+20;
  // An actor line that would cut through another case runs along the row gutter above its case instead.
  const ells=nodes.map(n=>Object.assign({id:n.id},cb(n.id)));
  const cuts=(p,q,id)=>ells.some(e=>e.id!==id&&Array.from({length:24},(_,i)=>i/23).some(t=>{ const x=p[0]+(q[0]-p[0])*t, y=p[1]+(q[1]-p[1])*t; return ((x-e.cx)/e.rx)**2+((y-e.cy)/22)**2<1.05; }));
  const col0=ox+L.G.cx[0], colN=ox+L.G.cx[L.G.nc-1]+L.G.cw[L.G.nc-1];
  placed.forEach(o=>{
    const a=o.it.el, k=st(o.it), human=(a.kind||'human')==='human';
    o.cs.forEach(c=>{ const tx=o.left?c.cx-c.rx:c.cx+c.rx, sx=o.left?o.x+(human?18:hb):o.x-(human?18:hb), p=[sx,o.y-(human?10:0)];
      let pts=[p,[tx,c.cy]];
      if(cuts(p,[tx,c.cy],c.id)){ const yg=oy+L.G.gy(L.cell[c.id][1])-8, xe=o.left?col0-14:colN+14; pts=[p,[xe,yg],[c.cx,yg],[c.cx,c.cy-22]]; }
      s+=E(k==='rm'?'rm':(k==='new'?'new':''),line(pts),atone[nm(a)]); });
    const at=atone[nm(a)];
    if(human){ s+=TG(at,`<g class="actor${TC(at)}${k?' '+k:''}" transform="translate(${f1(o.x)},${f1(o.y)})"><circle cx="0" cy="-30" r="9"/><line x1="0" y1="-21" x2="0" y2="6"/><line x1="-15" y1="-12" x2="15" y2="-12"/><line x1="0" y1="6" x2="-12" y2="28"/><line x1="0" y1="6" x2="12" y2="28"/></g>`+T(o.x,o.y+46,label(a),'t-name'+(k==='rm'?' t-rm':''),'middle')); H=Math.max(H,o.y+60); }
    else { s+=TG(at,R(o.x-hb,o.y-22,AB,44,'box'+(a.kind==='external'?' ext':'')+TC(at)+(k?' '+k:''),4)+T(o.x,o.y-5,a.kind==='external'?'«external»':'«system»','t-stereo','middle')+T(o.x,o.y+11,label(a),'t-name'+(k==='rm'?' t-rm':''),'middle')); H=Math.max(H,o.y+40); }
  });
  let inner=routeEdges(L,r=>E(st(r.e.it),arrow(r.pts,{dash:true,end:'open'})+labelSvg(r)));
  nodes.forEach(n=>{ const b=L.box[n.id], k=st(n.it), cx=b.x+b.w/2, cy=b.y+b.h/2;
    inner+=`<g${n.tone?` class="tone-${n.tone}"`:''}><title>${esc(nm(n.it.el))}</title><ellipse class="box${TC(n.tone)}${k?' '+k:''}" cx="${f1(cx)}" cy="${f1(cy)}" rx="${f1(b.w/2)}" ry="${f1(b.h/2)}"/>`+T(cx,cy+4,label(n.it.el),'t-case'+(k==='rm'?' t-rm':''),'middle')+`</g>`; });
  s+=`<g transform="translate(${ox},${oy})">${inner}</g>`;
  const W=rights.length?bx+bw+AW+30:bx+bw+30;
  return svg(W,H,'Use case diagram: '+d.title,s);
}

/* ---------- sequence: evenly spaced lifelines, labels in at most two lines ---------- */
function rSeq(d,M,warn){
  const parts=M.participants, idx={}; parts.forEach((p,i)=>idx[nm(p.el)]=i);
  const msgs=M.messages.filter(it=>{ const ok=it.el.from in idx&&it.el.to in idx; if(!ok) warn.push('message '+it.key+': unknown participant, not drawn'); return ok; });
  // Two balanced lines; a long unbreakable token (a URL, a DID) splits at : / . so one step cannot widen every gap.
  const lab=msgs.map((it,i)=>{ const t=(i+1)+' '+(it.el.text||''), ls=wrap2(t,'edge',150);
    return linesW(ls,'edge')>190?wrapN(t,'edge',Math.max(150,Math.ceil(meas(t,'edge')/2)+12),2):ls; });
  // Even gaps sized for the labels, capped at 200 px; a longer label spills past its lifelines and the canvas grows to fit.
  let need=150;
  msgs.forEach((it,i)=>{ const m=it.el; if(m.from===m.to) return; const span=Math.abs(idx[m.to]-idx[m.from]); need=Math.max(need,(linesW(lab[i],'edge')+28)/span); });
  const sp=Math.ceil(Math.max(Math.min(need,200),...parts.map(p=>meas(label(p.el),'name')+40)));
  let lo=0, hi=(parts.length-1)*sp;
  msgs.forEach((it,i)=>{ const m=it.el; if(m.from===m.to) return; const c=(idx[m.from]+idx[m.to])/2*sp, h=linesW(lab[i],'edge')/2; lo=Math.min(lo,c-h); hi=Math.max(hi,c+h); });
  const x0=Math.ceil(Math.max(80,sp/2+10,12-lo)), X=i=>x0+i*sp, hw=Math.min(sp-24,Math.max(110,...parts.map(p=>meas(label(p.el),'name')+28)));
  let y=64, body='', W=Math.max(x0+(parts.length-1)*sp+x0,x0+hi+12);
  msgs.forEach((it,i)=>{
    const m=it.el, xa=X(idx[m.from]), xb=X(idx[m.to]), k=m.kind||'call', ls=lab[i];
    const o=k==='return'?{dash:true,end:'open'}:k==='async'?{end:'open'}:{end:'fill'};
    let s='';
    if(m.from===m.to){
      y+=10;
      s+=arrow([[xa,y],[xa+26,y],[xa+26,y+16],[xa+2,y+16]],o);
      ls.forEach((l,j)=>{ s+=T(xa+34,y+10+j*13,l,'t-edge'); });
      W=Math.max(W,xa+34+linesW(ls,'edge')+16);
      y+=Math.max(26,ls.length*13+10)+14;
    } else {
      y+=ls.length*13+12;
      ls.forEach((l,j)=>{ s+=T((xa+xb)/2,y-6-(ls.length-1-j)*13,l,'t-edge','middle'); });
      s+=arrow([[xa,y],[xb,y]],o);
      y+=14;
    }
    body+=E(st(it),s,toneOf(m,warn,'message '+it.key));
  });
  const H=y+20;
  let head='';
  parts.forEach((p,i)=>{ const x=X(i), k=st(p), pt=toneOf(p.el,warn,'participant '+nm(p.el));
    head+=line([[x,50],[x,H-8]],'life')+TG(pt,R(x-hw/2,16,hw,34,'box'+TC(pt)+(k?' '+k:''),3)+T(x,38,label(p.el),'t-name'+(k==='rm'?' t-rm':''),'middle')); });
  return svg(W,H,'Sequence diagram: '+d.title,head+body);
}

const RENDER={class:rClass,erd:rErd,state:rState,component:rComp,usecase:rUse,sequence:rSeq};
const TYPE={class:'Class',erd:'Entity relationship',state:'State machine',component:'Component',usecase:'Use case',sequence:'Sequence'};
const CAPTION={
  component:'Boxes are deployable parts; frames are lanes. Solid arrows are calls or data flow; dashed arrows are indirect links. Shaded boxes are «external».',
  erd:'Crow’s feet mark the many side, a circle marks zero or optional, double bars mark exactly one. Rows marked + are new, ~ changed, - removed.',
  sequence:'Time runs down. Filled arrowheads are calls, dashed arrows are replies, open arrowheads are asynchronous notices.',
  state:'The filled dot is the start; the ringed dot is the end. Brackets hold a guard condition.',
  usecase:'Ellipses are use cases inside the system boundary; actors sit outside it. Dashed arrows are «include» and «extend».',
  class:'Diamonds mark composition, hollow triangles realization, dashed open arrows dependency. Numbers at the ends are multiplicities.'
};
const COUNT={component:['Nodes','nodes'],erd:['Tables','tables'],sequence:['Steps','messages'],state:['States','states'],usecase:['Cases','cases'],class:['Classes','classes']};

/* ---------- page ---------- */
function inline(s){ return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); }
function prose(md){
  const paras=String(md||'').split(/\n\s*\n/).map(p=>p.trim()).filter(p=>p&&!/^#/.test(p));
  const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  const table=ls=>{ const rows=ls.filter(l=>!/^\s*\|[\s:|-]+\|\s*$/.test(l)).map(cells);
    return '<div class="tablewrap"><table><thead><tr>'+rows[0].map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+
      rows.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'; };
  return paras.map(p=>{ const ls=p.split('\n');
    if(ls.length>1&&ls.every(l=>/^\s*\|/.test(l))) return table(ls);
    return ls.every(l=>/^\s*[-*] /.test(l)) ? '<ul>'+ls.map(l=>'<li>'+inline(l.replace(/^\s*[-*] /,''))+'</li>').join('')+'</ul>' : '<p>'+inline(ls.join(' '))+'</p>'; }).join('');
}
const TAGTXT={new:'new',chg:'changed',rm:'removed'};
const tag = s => s ? `<span class="tag ${s}">${TAGTXT[s]}</span>` : '';
const sid = id => 'd-'+String(id).replace(/[^A-Za-z0-9_-]/g,'_');
const pad = n => String(n).padStart(2,'0');
const dl = rows => '<dl>'+rows.map(r=>`<div><dt>${esc(r[0])}</dt><dd>${r[1]}</dd></div>`).join('')+'</dl>';

function main(){
  const curEl=$('uml-cur'), baseEl=$('uml-base'), ref=baseEl.dataset.ref;
  const out=$('sheets');
  if(!window.jsyaml){ out.innerHTML='<p class="err">Could not load js-yaml from cdnjs.cloudflare.com.</p>'; return; }
  const cur=parseModel(curEl.textContent,jsyaml.load);
  const base=ref?parseModel(baseEl.textContent,jsyaml.load):null;
  const delta=diffModels(base,cur);
  const title=cur.title||'System design', rev=cur.rev;
  const cnt={new:0,changed:0,removed:0}; delta.list.forEach(x=>cnt[x.st]++);
  const sheets=[];
  const errs=cur.errors.map(e=>'current: '+e).concat(base?base.errors.map(e=>'base: '+e):[]);
  if(errs.length) sheets.push({id:'errors',nav:'Errors',lvl:'Errors',title:'Model errors',facts:[],body:`<p class="err">${esc(errs.join('\n'))}</p>`});
  delta.sheets.forEach(sh=>{
    const d=sh.d, warn=[], s=ST[sh.st];
    let fig;
    try{ fig=RENDER[d.type](d,sh.merged,warn); }catch(e){ fig=''; warn.push('render failed: '+e.message); }
    const mine=delta.list.filter(x=>x.diagram===d.id&&x.kind!=='diagram');
    const review=d.review.length?`<div><h3>Check here</h3><ul>${d.review.map(r=>`<li>${inline(r)}</li>`).join('')}</ul></div>`:'';
    const changes=mine.length?`<div><h3>Changes</h3><ul class="delta">${mine.map(x=>`<li>${tag(ST[x.st])}<span><code>${esc(x.kind+' '+x.key)}</code>${x.name&&x.name!==x.key?' '+esc(x.name):''}${x.detail.length?' <code>'+esc(x.detail.join(', '))+'</code>':''}</span></li>`).join('')}</ul></div>`:'';
    const c=COUNT[d.type], n=(sh.merged[c[1]]||[]).filter(it=>it.st!=='removed').length;
    sheets.push({id:sid(d.id),nav:d.title,lvl:(d.level?d.level+' · ':'')+TYPE[d.type],title:d.title,st:s,
      facts:[[c[0],String(n)]],
      body:(d.note.trim()?`<div class="note">${prose(d.note)}</div>`:'')+
        (warn.length?`<p class="err">${esc(warn.join('\n'))}</p>`:'')+
        `<figure><div class="canvas">${fig}</div><figcaption>${d.caption?esc(String(d.caption)):CAPTION[d.type]}</figcaption></figure>`+
        (review||changes?`<div class="review">${review}${changes}</div>`:'<div style="height:24px"></div>')});
  });
  cur.sections.forEach((s,i)=>sheets.push({id:'prose-'+i,nav:s.title,lvl:'Notes',title:s.title,facts:[],body:`<div class="note" style="padding-bottom:24px">${prose(s.body)}</div>`}));
  const N=sheets.length;
  const facts=[['Source',`<code>${esc(curEl.dataset.model)}</code>`],['Base',ref?`<code>${esc(ref)}</code>`:'none'],['Sheets',String(N)]];
  if(rev) facts.unshift(['Revision',esc(rev)]);
  if(ref) facts.push(['Delta',`${cnt.new} new, ${cnt.changed} changed, ${cnt.removed} removed`]);
  const cover=`<section class="cover" id="cover"><div><div class="lvl">System design drawing set${rev?' · Rev '+esc(rev):''}</div><h1>${esc(title)}</h1></div>`+
    (cur.intro?`<div class="dek">${prose(cur.intro)}</div>`:'')+
    `<dl class="facts">${facts.map(f=>`<div><dt>${esc(f[0])}</dt><dd>${f[1]}</dd></div>`).join('')}</dl>`+
    `<div class="legend" aria-label="Legend"><span><i class="sw new"></i>new</span><span><i class="sw chg"></i>changed</span><span><i class="sw rm"></i>removed (struck through)</span><span><i class="sw ext"></i>«external» system</span><span><i class="sw"></i>unchanged</span></div>`+
    (cur.decided.length?`<div class="ask"><h2>Decided${rev?' in rev '+esc(rev):''}</h2><ol>${cur.decided.map(x=>`<li>${inline(x)}</li>`).join('')}</ol></div>`:'')+`</section>`;
  $('idx').innerHTML=`<div class="k">Drawing set${rev?' · Rev '+esc(rev):''}</div><a href="#cover"><span class="no">00</span><span>Cover</span><span></span></a>`+
    sheets.map((s,i)=>`<a href="#${s.id}"><span class="no">${pad(i+1)}</span><span>${esc(s.nav)}</span>${tag(s.st)||'<span></span>'}</a>`).join('');
  out.innerHTML=cover+sheets.map((s,i)=>{
    const meta=[['Sheet',`${pad(i+1)} / ${pad(N)}`]].concat(rev?[['Rev',esc(rev)]]:[],s.facts.map(f=>[f[0],esc(f[1])]),[['Delta',ref?(tag(s.st)||'<span class="tag same">none</span>'):'no base']]);
    return `<section class="sheet${s.st==='rm'?' s-rm':''}" id="${s.id}"><header class="tb"><div class="title"><div class="lvl">${esc(s.lvl)}</div><h2>${esc(s.title)}</h2></div>${dl(meta)}</header>${s.body}</section>`;
  }).join('');
  const links=[...document.querySelectorAll('.index a')];
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting) links.forEach(a=>a.classList.toggle('cur',a.hash==='#'+en.target.id)); }); },{rootMargin:'-40% 0px -55% 0px'});
    document.querySelectorAll('section.sheet,section.cover').forEach(s=>io.observe(s));
  }
}
const run=()=>{ try{ main(); }catch(e){ $('sheets').innerHTML='<p class="err">'+esc(e.stack||e)+'</p>'; } };
// Measure with the web fonts once they load; draw anyway after 3 s (offline, blocked fonts).
fonts();
const load=document.fonts&&document.fonts.load?Promise.all(Object.values(FONT).map(f=>document.fonts.load(f).catch(()=>0))):Promise.resolve();
Promise.race([load,new Promise(r=>setTimeout(r,3000))]).then(run);
})();
</script>
