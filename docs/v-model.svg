<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" font-family="ui-sans-serif, -apple-system, system-ui, Segoe UI, Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1040" height="760" fill="#ffffff"/>

  <!-- title + subtitle (cognitive payload) -->
  <text x="520" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">The dwarves-kit V-model</text>
  <text x="520" y="58" text-anchor="middle" font-size="12" fill="#6b7280">Left builds and reviews each artifact; the right tests its mirror. Commands trigger; agents do the isolated work.</text>

  <!-- legend -->
  <g font-size="11" fill="#374151">
    <rect x="318" y="74" width="14" height="12" rx="2" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="338" y="84">command (you invoke)</text>
    <rect x="492" y="74" width="14" height="12" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="512" y="84">agent (dispatched, isolated)</text>
    <rect x="690" y="74" width="14" height="12" rx="2" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="710" y="84">gap (to build / orphan)</text>
  </g>

  <!-- column headers -->
  <text x="210" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">BUILD  &#8595;  (left arm: produce + review)</text>
  <text x="830" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">TEST  &#8593;  (right arm: execute the mirror)</text>

  <!-- faint V arms -->
  <path d="M 210 128 L 210 480 L 420 510" fill="none" stroke="#c7d2fe" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 830 128 L 830 480 L 620 510" fill="none" stroke="#c7d2fe" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- mirror lines (dashed) + question on each -->
  <g stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,3">
    <line x1="360" y1="163" x2="680" y2="163"/>
    <line x1="360" y1="247" x2="680" y2="247"/>
    <line x1="360" y1="331" x2="680" y2="331"/>
    <line x1="360" y1="415" x2="680" y2="415"/>
  </g>
  <g font-size="10" font-style="italic" fill="#6b7280" text-anchor="middle">
    <text x="520" y="159">solves the pain?</text>
    <text x="520" y="243">whole thing works?</text>
    <text x="520" y="327">parts wire up?</text>
    <text x="520" y="411">each task meets AC?</text>
  </g>

  <!-- ============ LEFT COLUMN: BUILD ============ -->
  <!-- L1 Brief / Requirement -->
  <g filter="url(#shadow)">
    <rect x="60" y="128" width="300" height="70" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
    <rect x="60" y="128" width="300" height="3" rx="1.5" fill="#4f46e5"/>
  </g>
  <text x="74" y="150" font-size="13" font-weight="700" fill="#111827">Brief / Requirement</text>
  <text x="74" y="169" font-size="11" fill="#4f46e5" font-family="ui-monospace, Menlo, monospace">build: /kit:think &#183; /kit:assign</text>
  <text x="74" y="186" font-size="11" fill="#9ca3af">review: none (ship-gate traces back)</text>

  <!-- L2 Solution-design -->
  <g filter="url(#shadow)">
    <rect x="60" y="212" width="300" height="70" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
    <rect x="60" y="212" width="300" height="3" rx="1.5" fill="#4f46e5"/>
  </g>
  <text x="74" y="234" font-size="13" font-weight="700" fill="#111827">Solution-design</text>
  <text x="74" y="253" font-size="11" fill="#4f46e5" font-family="ui-monospace, Menlo, monospace">build: /kit:design</text>
  <text x="74" y="270" font-size="11" fill="#4f46e5" font-family="ui-monospace, Menlo, monospace">review: /kit:devs-team</text>

  <!-- L3 Spec -->
  <g filter="url(#shadow)">
    <rect x="60" y="296" width="300" height="78" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
    <rect x="60" y="296" width="300" height="3" rx="1.5" fill="#4f46e5"/>
  </g>
  <text x="74" y="318" font-size="13" font-weight="700" fill="#111827">Spec</text>
  <text x="74" y="337" font-size="11" fill="#4f46e5" font-family="ui-monospace, Menlo, monospace">build: /kit:spec <tspan fill="#9ca3af">(+ research-* agents)</tspan></text>
  <text x="74" y="354" font-size="11" fill="#4f46e5" font-family="ui-monospace, Menlo, monospace">review: /kit:spec-validate</text>

  <!-- L4 Code (vertex side) -->
  <g filter="url(#shadow)">
    <rect x="60" y="388" width="300" height="92" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
    <rect x="60" y="388" width="300" height="3" rx="1.5" fill="#4f46e5"/>
  </g>
  <text x="74" y="410" font-size="13" font-weight="700" fill="#111827">Code</text>
  <text x="74" y="429" font-size="11" fill="#4f46e5" font-family="ui-monospace, Menlo, monospace">build: /kit:execute &#183; /kit:next <tspan fill="#9ca3af">(+fix-agent)</tspan></text>
  <text x="74" y="446" font-size="11" fill="#4f46e5" font-family="ui-monospace, Menlo, monospace">review: /kit:review &#183; /kit:review-team</text>
  <text x="74" y="463" font-size="11" fill="#6b7280" font-family="ui-monospace, Menlo, monospace">+ security-auditor (deep security, via /kit:review-team)</text>

  <!-- ============ RIGHT COLUMN: TEST ============ -->
  <!-- R1 Acceptance test -->
  <g filter="url(#shadow)">
    <rect x="680" y="128" width="300" height="70" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
    <rect x="680" y="128" width="300" height="3" rx="1.5" fill="#4f46e5"/>
  </g>
  <text x="694" y="150" font-size="13" font-weight="700" fill="#111827">Acceptance test</text>
  <text x="694" y="172" font-size="11" fill="#4f46e5" font-family="ui-monospace, Menlo, monospace">/kit:ship gate</text>

  <!-- R2 System test -->
  <g filter="url(#shadow)">
    <rect x="680" y="212" width="300" height="70" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5,3"/>
    <rect x="680" y="212" width="300" height="3" rx="1.5" fill="#9ca3af"/>
  </g>
  <text x="694" y="234" font-size="13" font-weight="700" fill="#111827">System test</text>
  <text x="694" y="256" font-size="11" fill="#6b7280" font-family="ui-monospace, Menlo, monospace">project test suite (run at build + ship)</text>

  <!-- R3 Integration test -->
  <g filter="url(#shadow)">
    <rect x="680" y="296" width="300" height="70" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5,3"/>
    <rect x="680" y="296" width="300" height="3" rx="1.5" fill="#9ca3af"/>
  </g>
  <text x="694" y="318" font-size="13" font-weight="700" fill="#111827">Integration test</text>
  <text x="694" y="340" font-size="11" fill="#6b7280" font-family="ui-monospace, Menlo, monospace">integration-checker  (agent)</text>

  <!-- R4 Unit / task test -->
  <g filter="url(#shadow)">
    <rect x="680" y="388" width="300" height="92" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5,3"/>
    <rect x="680" y="388" width="300" height="3" rx="1.5" fill="#9ca3af"/>
  </g>
  <text x="694" y="410" font-size="13" font-weight="700" fill="#111827">Unit / task test</text>
  <text x="694" y="429" font-size="11" fill="#6b7280" font-family="ui-monospace, Menlo, monospace">task-verifier  (agent, in /kit:execute)</text>
  <text x="694" y="450" font-size="11" fill="#4f46e5" font-family="ui-monospace, Menlo, monospace">re-run: /kit:verify (read-only)</text>
  <text x="694" y="466" font-size="10" fill="#9ca3af">on-demand, read-only, no rebuild</text>

  <!-- ============ VERTEX ============ -->
  <g filter="url(#shadow)">
    <rect x="370" y="500" width="300" height="80" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <rect x="370" y="500" width="300" height="3" rx="1.5" fill="#4338ca"/>
  </g>
  <text x="520" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Build vertex: code + test code</text>
  <text x="520" y="544" text-anchor="middle" font-size="11" fill="#4f46e5" font-family="ui-monospace, Menlo, monospace">/kit:execute &#183; /kit:next</text>
  <text x="520" y="562" text-anchor="middle" font-size="11" fill="#4f46e5" font-family="ui-monospace, Menlo, monospace">test design: /kit:test-plan</text>

  <!-- ============ side notes ============ -->
  <g>
    <rect x="60" y="606" width="300" height="58" rx="6" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
    <text x="74" y="626" font-size="11" font-weight="700" fill="#374151">UI track (downstream)</text>
    <text x="74" y="645" font-size="10.5" fill="#4f46e5" font-family="ui-monospace, Menlo, monospace">/kit:ui-design &#8594; review /kit:visual-team</text>

    <rect x="372" y="606" width="296" height="58" rx="6" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
    <text x="386" y="626" font-size="11" font-weight="700" fill="#374151">Docs</text>
    <text x="386" y="645" font-size="10.5" fill="#4f46e5" font-family="ui-monospace, Menlo, monospace">/kit:docs &#8594; <tspan fill="#6b7280">doc-verifier (agent)</tspan></text>

    <rect x="680" y="606" width="300" height="58" rx="6" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
    <text x="694" y="626" font-size="11" font-weight="700" fill="#374151">Cross-phase (outside the V)</text>
    <text x="694" y="643" font-size="9.5" fill="#4f46e5" font-family="ui-monospace, Menlo, monospace">/kit:start &#183; /kit:retro &#183; /kit:debug &#183;</text>
    <text x="694" y="656" font-size="9.5" fill="#4f46e5" font-family="ui-monospace, Menlo, monospace">/kit:kit-health &#183; /kit:absorb</text>
  </g>

  <!-- ============ takeaway band ============ -->
  <rect x="60" y="688" width="920" height="40" rx="6" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="520" y="713" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3730a3">Every artifact is checked twice: a static review when built (left), a dynamic test when run (right). Commands trigger; agents are the isolated actors they dispatch.</text>
</svg>
