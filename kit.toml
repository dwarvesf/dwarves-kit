# kit.toml , dwarves-kit configuration (SHIPPED DEFAULT, SPEC-183)
#
# This is the repo-root default of the FORWARD-LOOKING config surface for the
# harness. Two levels:
#   1. kit-root  kit.toml (this file)  , the default that ships with the kit.
#   2. <project>/.kit.toml             , per-project override (project keys WIN;
#                                         write only the keys you change, the rest inherit).
#
# `install.sh` renders `~/.claude/dwarves-kit/kit.toml` (the live install copy)
# FROM this file at install time, recomputing only the `[modules]` section from
# the run's `--with` flags; every other section copies through verbatim. In a
# kit-repo-local dev session (KIT_CONFIG_ROOT / DWARVES_KIT pointed at this
# checkout), the resolver reads THIS file directly, no install step needed.
#
# READ MODEL (locked, ADR pending): a single resolver `lib/config/kit-config.sh`
# owns load + merge + precedence (mirrors lib/telemetry/kit-log-dir.sh , "one
# place the default lives"). COMMANDS and feature libs call it AT INVOCATION; the
# hot spine hooks NEVER read it (that keeps the no-runtime-manifest-read lint
# green , the lint forbids HOOK reads, not command reads).
#
# STATUS TAGS on every key , do not assume an inert key does anything:
#   [impl]     wired today; the resolver just needs to surface it (usually an env var)
#   [design]   concretely designed, not built yet (has a design doc / mega)
#   [reserved] placeholder for a planned feature; no code path yet
#   [consumer] the toggle lives in an external consumer skill, not the kit engine;
#              kept here so the harness has ONE control surface (Han, 2026-07-06)
# ---------------------------------------------------------------------------

# ======================= HARNESS OPS (ships today) =======================

[modules]                       # [impl] install.sh KIT_KNOWN_MODULES; gates HOOKS + PATH CLI shims
board          = true           #        commands/skills always install regardless
session        = true
advisor        = true
cosmetic       = false
queue          = true           # hookless (orchestrate/dispatch are commands)
stats          = true           # hookless
quiz_gate      = false          # hookless; backs commands/quiz-gate.md
weekend_batch  = false          # hookless; backs lib/queue/weekend-batch.sh
# bridge: folded into `sync` 2026-07-16 (one engine surface; legacy
#         mirror/status/writeback verbs remain until the SPEC-002 P2 port, ID-290)
worktree       = false          # hookless; exposes the worktree-provision CLI
money_gate     = false          # money-gate.sh PreToolUse guard; inert without MONEY_GATE_REPOS
prose_rag      = false          # prose-rag.sh recall inject + CLI; dormant without PROSE_RAG_INJECT=1
sync           = false          # hookless; `board sync` two-way spoke mirror, inert without [sync] sources
cloud          = false          # cloud-session support; hooks are inert unless CLAUDE_CODE_REMOTE=true
team_mode      = false          # reserved , install.sh hard-rejects it today

[cloud]                         # read by lib/cloud/provision.sh in a Claude Code cloud VM.
                                # TWO TIERS, because a project's .kit.toml rides in the repo
                                # and a pull request can set it:
                                #   PROJECT tier -- set it in the PROJECT's .kit.toml.
                                #   OPERATOR tier -- set it HERE or in the environment's own
                                #     CLOUD_<KEY> variable; a project .kit.toml is IGNORED,
                                #     because the value selects code to run or names a
                                #     credential (lib/config/kit-config.sh kit_config_get_root).
                                # Every key also takes a CLOUD_<KEY> env override. Unset keys
                                # fall back to a neutral default, so provisioning still does the
                                # generic work with no config at all.
# --- PROJECT tier (inert data) ---
# workspace  = "~/workspace"    # where sibling repos are cloned. default $HOME/workspace
# repos      = "a,b/c"          # sibling repos to clone: <name> or <owner>/<name>
# repo_owner = ""               # default owner for a bare name in `repos`
# map        = ""               # repo-relative routing map printed by `cloud map`
# rules      = ""               # repo-relative cloud-rules file. default lib/cloud/CLOUD-RULES.md
# op_version = "v2.31.1"        # pinned 1Password CLI release
# --- OPERATOR tier (selects code to run, or names a credential) ---
# plugins    = "x@mk|owner/mk"  # behavioral plugins to install: <id>|<marketplace-slug> pairs.
#                               # An install runs unattended, with no human to approve it
# hooks_path = ".githooks"      # repo-relative core.hooksPath to arm. Arming it turns scripts a
#                               # plain clone leaves inert into code every git command runs.
#                               # Never auto-armed from a directory found in the tree
# vault      = ""               # secret vault name, reported in the canary verdict
# canary_ref = ""               # op:// ref proving the vault is reachable. default
#                               # op://<vault>/cloud-canary/credential when vault is set

[ledger]                        # where the harness stores its operation record
location            = "shared"  # [impl] "shared" (XDG, one root for all projects)
                                #        | "isolated" (this project's own ./.kit/logs)
                                #        | "<explicit path>".  Resolves KIT_LEDGER_DIR.
telemetry           = true      # [impl] write run-tracking streams or not
delivery_ratio_warn = 3         # [impl] KIT_DELIVERY_RATIO_WARN (proof-vs-real gate)
delivery_real_floor = 40        # [impl] KIT_DELIVERY_REAL_FLOOR
# retention         = ...       # [reserved] ledger is append-only today, no rotation

[mega]                          # read when /kit:mega + orchestrate scaffold/run
wave_cap           = 2          # [impl] WAVE_CAP
tier4_close        = true       # [impl] TIER4_CLOSE (SPEC-118)
multiplexer        = false      # [impl] MULTIPLEXER (SPEC-119)
merge_autonomy     = "gated-final"      # [impl] "gated-final" | "full-auto"
mega_merge_posture = "auto-to-final"    # [impl] "auto-to-final" | "per-pr-review"
default_model      = "sonnet"   # [design] GLOBAL fallback. Real control today is the
                                #        per-sub-goal `Model:` goal-file field. Kept as a
                                #        global so an adopter on a DIFFERENT harness/model
                                #        (not Claude Code) can set one default. Precedence:
                                #        goal-file `Model:` > project cfg > this default.
over_test          = false      # [design] GLOBAL default for scaffold rigor. Real control
                                #        today is per-sub-goal `Done-mode: over-test`
                                #        (SPEC-112). Global default for other-harness adopters.
enabled_agent_clis = ""         # [impl] opt-in NON-claude dispatch. Space-separated list
                                #        of agent CLIs a sub-goal's `Harness:` header may
                                #        name (codex | pi | opencode). EMPTY = claude-only
                                #        (default; multi-vendor OFF). claude is always
                                #        available and never listed here. e.g.
                                #        enabled_agent_clis = "codex" bills those sub-goals
                                #        to codex's quota. Enable only CLIs you have installed
                                #        AND authenticated. SECURITY: read from the KIT-ROOT
                                #        install kit.toml ONLY, never a project .kit.toml (a
                                #        committed .kit.toml rides inside an untrusted PR and
                                #        could self-enable a vendor). See commands/mega.md
                                #        "Harness routing (multi-vendor dispatch)".

[gate]
understanding_gate = true       # [impl] hooks/anti-rationalization.sh (ADR-0031). Always-on
                                #        today; exposing an on/off toggle is NEW work.

[features]                      # harness-adjacent toggles (kept as one control surface)
auto_improvement = false        # [impl] `learn propose` (SPEC-195): read-plane loop over the
                                #        ledger -> cited, deduped, adversarially-checked backlog
                                #        proposals. The command is always available; this flag
                                #        gates only the WEEKLY unattended cadence, consumer-side
                                #        (SG-10 LaunchAgent), never kit-side. Default off (opt-in).
learning_ledger  = true         # [consumer] the orchestration is an external skill
                                #        (ops-toolkit/dotfiles, SPEC-126); the kit only
                                #        collects (weekend-batch.sh) + routes. Toggle kept
                                #        here so the harness config is the single surface.
memory_tidy      = false        # [consumer] the unattended biweekly memory-audit cadence.
                                #        The judgment skill itself ships with the kit
                                #        (skills/memory-tidy, pairing with `stats memory-sweep`)
                                #        and is always available; this flag gates only the
                                #        scheduled consumer-side runner (e.g. ops-toolkit
                                #        tools/memory-tidy LaunchAgent). Default off (opt-in).

# =============== TEAM COLLABORATION (designed, not built , all off) ===============
# Source: ops-toolkit/_meta/megagoals/team-mode/ (ROADMAP + DESIGN-01..07),
#         docs/research/2026-07-04-team-collab-workflow-proposal.md (v3).
# Held until kit-modularity ships; install.sh rejects team_mode until then.

[team]
actor_identity   = false        # [design] `actor=` on gate rows + Owner col + `claim` verb
attestation      = false        # [design] docs/runs/<rid>.md branch-riding + `attested-for=`
ci_recheck       = false        # [design] report-only GitHub Action, always exit 0
spec_reservation = false        # [design] pushed spec-stub branch = SPEC-number reservation
policy           = false        # [design] git-tracked [policy]: path fences, guarded verbs
onboarding       = false        # [design] adopt --with team -> TEAM.md
pilot            = false        # [design] end-to-end UAT (held)

# --- sync: two-way spoke mirror for the kanban board (`board sync`) ----------
# Per-repo values live in the project's .kit.toml; this block declares the keys
# and kit-wide defaults. Sources plug in by listing them in `sources` and
# filling that spoke's keys (the plugin mechanism: no section entry, no spoke).
# Engine: lib/sync/ (python, stdlib); resolution happens in board.sh cmd_sync
# via kit-config.sh -- the engine itself never reads TOML.

[sync]
apps           = ""             # [impl] comma list of apps to sync to: reminders,notion,hermes,multica; empty = sync off. Legacy aliases: `surfaces`, `sources`
mode           = "manual"       # [impl] manual | cron; cron gates lib/sync/deploy/macos/install (kit ID-289)
interval_secs  = 3600           # [impl] cron LaunchAgent StartInterval seconds; --interval-secs overrides at install
reminders_list = "Backlog"      # [impl] Reminders list name
notion_db      = ""             # [impl] bind an existing Notion database id
notion_parent  = ""             # [impl] Notion page id to create the board under (bootstrap)
hermes_target  = "mini-tieubao" # [impl] ssh host for the hermes spoke
scope_exit_cap = 20             # [impl] max rows one run may close on an app when a filter changes; --allow-scope-exit overrides
# Per-app audience filters (SPEC-002 P1). only_tags: row must carry one;
# skip_tags: row must carry none; intake: all | tagged:<tag> | none.
reminders_only_tags = ""        # [impl]
reminders_skip_tags = ""        # [impl]
reminders_intake    = ""        # [impl] default all
notion_only_tags    = ""        # [impl]
notion_skip_tags    = ""        # [impl]
notion_intake       = ""        # [impl] default all
hermes_only_tags    = ""        # [impl]
hermes_skip_tags    = ""        # [impl]
hermes_intake       = ""        # [impl] default all
multica_only_tags   = ""        # [impl]
multica_skip_tags   = ""        # [impl]
multica_intake      = ""        # [impl] default all
hermes_home    = ""             # [impl] HERMES_HOME of the kanban store to sync

[observe]                       # the bench/observability plane (lib/bench)
# Scope of the exported fleet payload. Empty = PERSONAL (everything on this
# host). Non-empty = TEAM: a hard allowlist of repos, filtered before any
# metric, so a shared payload cannot leak other projects' numbers.
repos = ""                      # [impl] comma list, e.g. "dwarves-kit,webapp"; CLI --repos overrides
push_url = ""                   # [impl] gateway base for `export --push` (FORGE_ADMIN_TOKEN in env)

[gauntlet]                      # side-flow 11 (commands/gauntlet.md); read by tests/gauntlet/cleanroom/run-remote.sh
runner_host = "local"           # "local" runs rounds on this machine; an ssh host alias (e.g. "mini-tieubao") ships committed state there, runs the round, pulls the record back. The host resolves the probe key from ITS OWN secret store; the key never travels over ssh.
probe_key_ref = "op://Toolkit/anthropic-api-key/credential"  # 1P ref the RUNNER host resolves at run time; point at a dedicated spend-capped item when minted
